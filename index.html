<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма регистрации — учебный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-container">
    <span class="eyebrow">ДОБРО ПОЖАЛОВАТЬ</span>
    <h1>Создайте аккаунт</h1>
    <p class="intro">Укажите телефон и придумайте пароль, чтобы начать.</p>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="tel" autocomplete="tel" aria-describedby="phoneHint phoneError" id="phone" name="phone" placeholder="+79991234567">
        <p class="hint" id="phoneHint">Например, +79991234567</p>
        <span class="error" id="phoneError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" autocomplete="new-password" aria-describedby="passwordHint strengthLabel passwordError" id="password" name="password" placeholder="Минимум 8 символов">
        <p class="hint" id="passwordHint">От 8 символов. Добавьте цифру, спецсимвол или буквы разного регистра.</p>
        <div class="strength-meter" aria-hidden="true">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
        <span class="error" id="passwordError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Повторите пароль</label>
        <input type="password" autocomplete="new-password" aria-describedby="confirmError" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль">
        <span class="error" id="confirmError" aria-live="polite"></span>
      </div>

      <button type="submit" id="submitBtn">Зарегистрироваться</button>
      <div class="success" id="successMessage" role="status"></div>
    </form>
    <p class="demo-note">Учебная форма · Данные не отправляются на сервер</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
